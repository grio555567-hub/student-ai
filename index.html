<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF8">

<title>StudyMind AI — умный помощник студента</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <div class="logo">
      <span class="logo-bolt">⚡</span>
      <span class="logo-text">StudyMind <b>AI</b></span>
    </div>
    <div class="header-streak" id="streak" title="Серия учебных дней">
      <span class="streak-fire">🔥</span><span id="streak-count">0</span>
    </div>
  </header>

  <main id="screen-root" class="screen-root"></main>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn" data-view="home"><span class="nav-ico">🏠</span><span class="nav-label">Главная</span></button>
    <button class="nav-btn" data-view="schedule"><span class="nav-ico">📅</span><span class="nav-label">Расписание</span></button>
    <button class="nav-btn nav-btn-special" data-view="record"><span class="nav-ico">🎙️</span><span class="nav-label">Запись</span></button>
    <button class="nav-btn" data-view="courses"><span class="nav-ico">📚</span><span class="nav-label">Курсы</span></button>
    <button class="nav-btn" data-view="autopilot"><span class="nav-ico">🧠</span><span class="nav-label">Автопилот</span></button>
  </nav>
</div>

<div id="modal-root" class="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  /* PDF.js worker (for reading real PDF files) */
  window.PDFJS_READY = false;
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    window.PDFJS_READY = true;
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
  /* OCR for scans & photos (Tesseract.js) */
  window.OCR_READY = false;
  if (window.Tesseract) window.OCR_READY = true;
</script>
<script src="js/store.js?v=11"></script>
<script src="js/analyzer.js?v=11"></script>
<script src="js/planner.js?v=11"></script>
<script src="js/app.js?v=11"></script>


</body>
</html>
